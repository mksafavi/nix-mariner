name: build flake

on:
  workflow_dispatch: # allows manual triggering
  push:

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: rrbutani/use-nix-shell-action@v1
        with:
          devShell: .#devShells.x86_64-linux.default
      - run: |
          treefmt --ci
      - run: |
          deadnix --fail

  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - id: list
        run: |
          echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.eval.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: 'holster'
          root-safe-haven: '10240'
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: rrbutani/use-nix-shell-action@v1
        with:
          devShell: .#devShells.x86_64-linux.default
      - run: |
          nix-fast-build --skip-cached --no-nom --retries 3 --flake .#checks.x86_64-linux.${{ matrix.check }}
